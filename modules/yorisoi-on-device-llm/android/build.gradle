plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.yorisoiondevicellm'
version = '0.1.0'

android {
  namespace "expo.modules.yorisoiondevicellm"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    minSdkVersion 24
  }
}

dependencies {
  // MediaPipe LLM Inference (maintenance-mode but shipping). Text-only; no image path.
  implementation 'com.google.mediapipe:tasks-genai:0.10.27'
  implementation 'androidx.core:core-ktx:1.13.1'
}
